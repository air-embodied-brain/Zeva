[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeva-action-encoder"
version = "0.1.0"
description = "Action-token encoder models and training logic used by Zeva-Ego"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "torch==2.7.1",
]

[project.optional-dependencies]
vision = ["timm>=1.0", "xformers>=0.0.25"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
