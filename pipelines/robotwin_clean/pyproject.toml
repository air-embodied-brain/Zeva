[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeva-robotwin-clean"
version = "0.1.0"
description = "Clean-only RoboTwin EEF16 training contracts for Zeva-Ego"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
]

[project.optional-dependencies]
train = ["lerobot @ git+https://github.com/huggingface/lerobot.git@6adf51511b7625090eade8d82d9f61a1846ebe56"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
